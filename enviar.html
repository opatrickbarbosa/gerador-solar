<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Envía tu propuesta · Kilovia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1B2B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1B2B'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF7A1A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
.ehead{padding:130px 0 64px;overflow:hidden;isolation:isolate}
.ehead h1{font-size:clamp(36px,6vw,64px)}
.ecard{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(22px,4vw,44px);margin-top:-32px;box-shadow:0 30px 60px -40px rgba(11,27,43,.35)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:16px}
legend{font:700 20px "Inter Tight",sans-serif;color:var(--ink);margin-bottom:14px;padding:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.sep{height:1px;background:var(--line);margin:8px 0}
.back{color:var(--soft);text-decoration:none;font-size:14px;display:inline-flex;gap:6px;align-items:center}
</style>
<script src="/assets/i18n.js"></script>
</head>
<body data-title="title_env">

<header class="nav solid">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Kilovia"><i aria-hidden="true"></i>kilovia</a>
    <div class="nav-r">
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="ca">CA</button><button type="button" data-lang="pt">PT</button>
      </div>
    </div>
  </div>
</header>

<main>
<section class="ehead dark">
  <div class="gridlines" aria-hidden="true"></div>
  <div class="orb sun" style="top:-200px;right:-160px" aria-hidden="true"></div>
  <div class="wrap" style="max-width:860px;display:flex;flex-direction:column;gap:18px">
    <a class="back" href="/">← <span data-i18n="e_back"></span></a>
    <h1 data-i18n="e_h1"></h1>
    <p class="lead" data-i18n="e_sub"></p>
  </div>
</section>

<div class="wrap" style="max-width:860px;padding-bottom:96px">
  <div class="ecard" id="formbox">
    <form id="form" novalidate style="gap:28px">
      <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website2" tabindex="-1" autocomplete="off"></label></div>

      <fieldset>
        <legend data-i18n="f_g1"></legend>
        <div class="fgrid">
          <label><span class="req" data-i18n="l_empresa"></span><input type="text" name="empresa" required autocomplete="organization"></label>
          <label><span class="req" data-i18n="l_nombre"></span><input type="text" name="nombre" required autocomplete="name"></label>
          <label><span class="req" data-i18n="l_email"></span><input type="email" name="email" required autocomplete="email"></label>
          <label><span class="req" data-i18n="l_tel"></span><input type="tel" name="telefono" required autocomplete="tel"></label>
          <label><span data-i18n="l_web"></span><input type="text" name="web" inputmode="url" placeholder="tuempresa.es"></label>
          <label><span data-i18n="l_ciudad"></span><input type="text" name="ciudad"></label>
        </div>
      </fieldset>

      <div class="sep"></div>

      <fieldset>
        <legend data-i18n="f_g3"></legend>
        <label><span class="req" data-i18n="l_prop"></span><input type="file" name="propuesta" required accept=".pdf,.doc,.docx,.odt,.ppt,.pptx,image/*"></label>
        <label><span data-i18n="l_xls"></span><input type="file" name="calculo" accept=".xls,.xlsx,.xlsm,.ods,.csv"></label>
        <label><span data-i18n="l_logo"></span><input type="file" name="logo" accept=".png,.jpg,.jpeg,.svg,.webp,.pdf"></label>
        <label><span data-i18n="l_otros"></span><input type="file" name="otros" multiple></label>
        <p style="font-size:14px;color:var(--muted)" data-i18n="hint_files"></p>
      </fieldset>

      <div class="sep"></div>

      <fieldset>
        <legend data-i18n="f_g2"></legend>
        <div class="fgrid">
          <label><span data-i18n="l_com"></span><input type="number" name="comerciales" min="1" max="500" inputmode="numeric"></label>
          <label><span data-i18n="l_vol"></span>
            <select name="volumen"><option value="">—</option><option value="<20" data-i18n="v1"></option><option value="20-50" data-i18n="v2"></option><option value="50-100" data-i18n="v3"></option><option value=">100" data-i18n="v4"></option></select>
          </label>
          <label><span data-i18n="l_tool"></span>
            <select name="herramienta"><option value="">—</option><option value="Excel">Excel</option><option value="Google Sheets">Google Sheets</option><option value="PVGIS">PVGIS</option><option value="Software FV" data-i18n="t4"></option><option value="Otro" data-i18n="t5"></option></select>
          </label>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <p style="font-size:14px;font-weight:500" data-i18n="l_cli"></p>
          <div class="opts">
            <label class="opt"><input type="checkbox" name="clientes" value="Residencial"><span data-i18n="k1"></span></label>
            <label class="opt"><input type="checkbox" name="clientes" value="Empresas"><span data-i18n="k2"></span></label>
            <label class="opt"><input type="checkbox" name="clientes" value="Comunidades"><span data-i18n="k3"></span></label>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <p style="font-size:14px;font-weight:500" data-i18n="l_inc"></p>
          <div class="opts">
            <label class="opt"><input type="checkbox" name="incluye" value="Baterías"><span data-i18n="i1"></span></label>
            <label class="opt"><input type="checkbox" name="incluye" value="Cargador VE"><span data-i18n="i2"></span></label>
            <label class="opt"><input type="checkbox" name="incluye" value="Subvenciones/Financiación"><span data-i18n="i3"></span></label>
          </div>
        </div>
        <label><span data-i18n="l_msg"></span><textarea name="mensaje" data-i18n-ph="ph_msg"></textarea></label>
      </fieldset>

      <label class="opt" style="align-items:flex-start"><input type="checkbox" name="privacidad" required style="margin-top:2px"><span class="req" data-i18n="l_priv"></span></label>

      <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
        <button class="btn" type="submit" id="submit" data-i18n="e_submit"></button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <a class="wa" href="https://wa.me/34662695649" target="_blank" rel="noopener" data-i18n="wa"></a>
      </div>
    </form>

    <div class="done" role="status">
      <div class="ok-ic"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E4FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 style="font-size:36px" data-i18n="ok_t"></h2>
      <p style="color:var(--muted);font-size:17px" data-i18n="ok_d"></p>
    </div>
  </div>
</div>
</main>

<footer>
  <div class="wrap">
    <p><strong style="color:#fff">kilovia</strong> · <span data-i18n="foot"></span></p>
    <p><a class="wa" href="https://wa.me/34662695649" target="_blank" rel="noopener">+34 662 695 649</a> · <a href="/privacidad" data-i18n="priv_link"></a></p>
  </div>
</footer>

<script src="/assets/enviar.js"></script>
</body>
</html>
